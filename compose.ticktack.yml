# TickTack on Coolify: build Dockerfile.kaneo from a reviewed commit first.
# TICKTACK_IMAGE must identify that immutable local image; never use "latest".
# Coolify creates a dedicated network and namespaced volumes for this service.
# Leave domains empty until the initial owner is created privately and anonymous
# registration is verified closed. Then route HTTPS to the ticktack service:5173.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ticktack
      POSTGRES_USER: ticktack
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - ticktack_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticktack -d ticktack"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticktack:
    image: ${TICKTACK_IMAGE:?}
    pull_policy: never
    environment:
      KANEO_CLIENT_URL: https://ticktack.slikk.io
      AUTH_SECRET: ${SERVICE_HEX_64_TICKTACK:?}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ticktack
      POSTGRES_USER: ticktack
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
      DISABLE_REGISTRATION: "true"
      DISABLE_PASSWORD_REGISTRATION: "true"
      DISABLE_GUEST_ACCESS: "true"
      KANEO_CLOUD: "false"
    volumes:
      - ticktack_data:/app/apps/api/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  ticktack_postgres:
  ticktack_data:
